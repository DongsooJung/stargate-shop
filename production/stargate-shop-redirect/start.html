<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="학년, C++ 경험, KOI 목표를 바탕으로 적합한 스타게이트에듀 학습 경로를 확인하는 무료 진단입니다."><meta name="robots" content="index,follow">
<link rel="canonical" href="https://shop.stargateedu.co.kr/start.html"><title>3분 KOI 학습 진단 · Stargate Edu</title>
<style>
:root{--navy:#0B2A4A;--gold:#C9A227;--ink:#1A2233;--gray:#667085;--line:#E4E7EC;--bg:#F7F9FC;--ok:#16794d}*{box-sizing:border-box}body{margin:0;font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}a{text-decoration:none;color:inherit}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:880px;margin:auto;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:20px;font-weight:900;color:var(--navy)}.logo b{color:var(--gold)}.back{font-size:14px;color:var(--navy);font-weight:700}main{max-width:880px;margin:44px auto;padding:0 20px}.intro{text-align:center;margin-bottom:28px}.eyebrow{color:var(--gold);font-weight:900;font-size:13px;letter-spacing:.7px}.intro h1{color:var(--navy);font-size:clamp(28px,5vw,42px);line-height:1.25;margin:8px 0}.intro p{color:var(--gray);margin:0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 14px 38px rgba(11,42,74,.07)}.question{border:0;padding:0;margin:0 0 28px}.question:last-of-type{margin-bottom:18px}.question legend{font-weight:900;color:var(--navy);font-size:17px;margin-bottom:12px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.option{position:relative}.option input{position:absolute;opacity:0}.option label{display:flex;min-height:68px;align-items:center;justify-content:center;text-align:center;padding:12px;border:1px solid var(--line);border-radius:11px;color:#475467;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}.option input:checked+label{border:2px solid var(--gold);background:#fff9e9;color:var(--navy)}.option label:hover{border-color:var(--gold)}.submit{width:100%;border:0;border-radius:11px;background:var(--gold);color:#3a2e00;padding:15px;font-size:16px;font-weight:900;cursor:pointer}.privacy{font-size:12px;color:var(--gray);text-align:center;margin-top:12px}.result{display:none;margin-top:22px;background:#fff;border:2px solid var(--gold);border-radius:18px;padding:28px}.result.show{display:block}.result-tag{color:var(--ok);font-size:13px;font-weight:900}.result h2{color:var(--navy);margin:6px 0}.result p{color:#475467}.reason{background:#F7F9FC;border-radius:10px;padding:14px;margin:16px 0;font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 20px;border-radius:9px;font-weight:900;text-align:center}.btn.primary{background:var(--gold);color:#3a2e00}.btn.secondary{border:1px solid var(--line);color:var(--navy)}@media(max-width:680px){main{margin-top:28px}.panel,.result{padding:20px}.options{grid-template-columns:1fr}.option label{min-height:54px}.actions .btn{width:100%}}
</style><link rel="stylesheet" href="/assets/stargate-tokens.css?v=20261017">
</head>
<body><header class="top"><div class="topin"><a class="logo" href="/">STARGATE<b>EDU</b></a><a class="back" href="/">← 안내로</a></div></header>
<main><section class="intro"><div class="eyebrow">FREE · NO SIGN-UP</div><h1>3분 KOI 학습 진단</h1><p>세 가지 질문으로 지금 필요한 시작 경로를 확인합니다.</p></section>
<form class="panel" id="diagnosis">
<fieldset class="question"><legend>1. 현재 학년은?</legend><div class="options"><div class="option"><input required type="radio" id="grade1" name="grade" value="elementary"><label for="grade1">초등 고학년</label></div><div class="option"><input type="radio" id="grade2" name="grade" value="middle"><label for="grade2">중학생</label></div><div class="option"><input type="radio" id="grade3" name="grade" value="high"><label for="grade3">고등학생 이상</label></div></div></fieldset>
<fieldset class="question"><legend>2. C++ 또는 텍스트 코딩 경험은?</legend><div class="options"><div class="option"><input required type="radio" id="exp1" name="experience" value="none"><label for="exp1">처음이에요</label></div><div class="option"><input type="radio" id="exp2" name="experience" value="basic"><label for="exp2">기초 문법 가능</label></div><div class="option"><input type="radio" id="exp3" name="experience" value="advanced"><label for="exp3">알고리즘 풀이 경험</label></div></div></fieldset>
<fieldset class="question"><legend>3. 가장 가까운 목표는?</legend><div class="options"><div class="option"><input required type="radio" id="goal1" name="goal" value="explore"><label for="goal1">알고리즘 입문</label></div><div class="option"><input type="radio" id="goal2" name="goal" value="competition"><label for="goal2">KOI·경시 준비</label></div><div class="option"><input type="radio" id="goal3" name="goal" value="plan"><label for="goal3">입시·학습 전략</label></div></div></fieldset>
<button class="submit" type="submit">추천 경로 확인</button><p class="privacy">세 가지 답은 이 브라우저에만 남고, 서버로는 전송되지 않습니다. 상담 메일을 보내면 그 메일에 답이 남습니다.</p></form>
<section class="result" id="result" aria-live="polite"><div class="result-tag">추천 결과</div><h2 id="resultTitle"></h2><p id="resultCopy"></p><div class="reason" id="resultReason"></div><div class="actions"><a class="btn primary" id="resultCta" href="/consult.html">이 답으로 상담 내용 만들기</a><a class="btn secondary" id="consultCta" href="mailto:support@stargateedu.co.kr?subject=KOI%20무료진단%20후%20상담%20신청">결과와 함께 상담</a></div></section></main>
<script>
(function(){"use strict";
var form=document.getElementById("diagnosis"),result=document.getElementById("result");
var shelves={
  file:{title:"25개 핵심 알고리즘 가이드",copy:"판매용 PDF가 확인되기 전에는 결제할 수 없습니다.",reason:"진단은 이 파일을 사라는 뜻이 아닙니다. 학습 순서를 문서로 보고 싶다면, 파일이 확인된 뒤에만 결제가 열립니다."},
  class:{title:"실시간 수업",copy:"개강일, 수강료, 정원, 환불은 아직 확정되지 않았습니다.",reason:"대회 준비가 목표여도 이 페이지에서 반을 등록하지는 않습니다. 수준만 문의할 수 있습니다."},
  consult:{title:"90분 전략 상담",copy:"안내 금액은 250,000원이고, 메일을 보내도 결제되지 않습니다.",reason:"입시나 대회 순서를 한 장으로 받으려면 일정을 먼저 정합니다. 상담이 전달되기 전에는 정기 멘토링을 열지 않습니다."}
};
form.addEventListener("submit",function(event){
  event.preventDefault();
  var data=new FormData(form),grade=data.get("grade"),experience=data.get("experience"),goal=data.get("goal");
  var key=goal==="plan"?"consult":goal==="competition"?"class":"file";
  var pick=shelves[key];
  var answers={grade:grade,experience:experience,goal:goal,shelf:key,savedAt:new Date().toISOString()};
  try{localStorage.setItem("sge-diagnosis",JSON.stringify(answers));}catch(_){}
  document.getElementById("resultTitle").textContent=pick.title;
  document.getElementById("resultCopy").textContent=pick.copy;
  document.getElementById("resultReason").textContent=pick.reason;
  var query=new URLSearchParams({grade:grade,experience:experience,goal:goal,shelf:key});
  document.getElementById("resultCta").href="/consult.html?"+query.toString();
  document.getElementById("resultCta").textContent="이 답으로 상담 내용 만들기";
  var summary="학년="+grade+", 경험="+experience+", 목표="+goal+", 안내="+pick.title;
  document.getElementById("consultCta").href="mailto:support@stargateedu.co.kr?subject="+encodeURIComponent("진단 세 가지 답")+"&body="+encodeURIComponent("진단 결과: "+summary+"\n\n이 메일은 결제가 아닙니다.\n이름:\n연락처:\n남기고 싶은 말:");
  result.classList.add("show");
  result.scrollIntoView({behavior:"smooth",block:"center"});
});
})();
</script></body></html>
